<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Resolve — Locations</title>
<style>
  :root{
    --bg:#0c0f12;
    --bg-2:#11161b;
    --panel:#151b22;
    --border:#232c36;
    --border-soft:#1c242d;
    --muted:#8a95a1;
    --text:#e6edf3;
    --text-dim:#b6bfca;
    --green:#22c55e;
    --teal-2:#2dd4bf;
    --ai-grad: linear-gradient(135deg, #22d3ee 0%, #2dd4bf 50%, #22c55e 100%);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
  body{
    background:
      radial-gradient(1100px 500px at 85% -10%, rgba(20,184,166,.08), transparent 60%),
      radial-gradient(900px 500px at -5% 110%, rgba(34,211,238,.06), transparent 60%),
      var(--bg);
    overflow:hidden;
  }
  .shell{display:grid;grid-template-columns:232px 1fr;height:100vh}

  /* SIDEBAR */
  .sb{background:var(--bg-2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 10px;gap:4px;height:100vh;overflow-y:auto}
  .logo{display:flex;align-items:center;gap:10px;padding:4px 10px 14px}
  .logo .mark{width:32px;height:32px;border-radius:9px;background:var(--ai-grad);display:grid;place-items:center;box-shadow:0 8px 20px -10px rgba(45,212,191,.6), inset 0 0 0 1px rgba(255,255,255,.12)}
  .logo .mark svg{width:17px;height:17px;color:#0a141b}
  .logo .wordmark{font-weight:700;letter-spacing:-.01em;font-size:17px;color:#f1f5f9}
  .logo .wordmark span{color:var(--green)}

  .agent-btn{margin:2px 2px;position:relative;padding:2px;border-radius:12px;background:var(--ai-grad);box-shadow:0 10px 24px -14px rgba(45,212,191,.7), 0 0 0 1px rgba(255,255,255,.04)}
  .agent-btn .inner{background:linear-gradient(180deg,#121820,#0e141a);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;color:#eaf2ff;cursor:pointer}
  .agent-btn .inner:hover{background:linear-gradient(180deg,#152230,#0f1820)}
  .agent-btn .spark{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
  .agent-btn .spark svg{width:13px;height:13px;color:#fff}
  .agent-btn .label{display:flex;flex-direction:column;line-height:1.1}
  .agent-btn .label b{font-size:13px;font-weight:600}
  .agent-btn .label small{color:#9fb0c2;font-size:10.5px;letter-spacing:.02em}
  .agent-btn .pulse{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--teal-2);box-shadow:0 0 0 0 rgba(45,212,191,.7);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(45,212,191,.7)}70%{box-shadow:0 0 0 10px rgba(45,212,191,0)}100%{box-shadow:0 0 0 0 rgba(45,212,191,0)}}

  .section{font-size:10.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;padding:14px 12px 6px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--text-dim);text-decoration:none;font-weight:500;font-size:13px;position:relative;cursor:pointer;user-select:none}
  .nav a:hover{background:#1a2129;color:var(--text)}
  .nav a.active{background:linear-gradient(180deg,rgba(34,197,94,.18),rgba(34,197,94,.06));color:#d7fbe4}
  .nav a.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--green)}
  .nav a svg{width:16px;height:16px;opacity:.9;flex-shrink:0}

  .sb-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--border-soft);display:flex;flex-direction:column;gap:2px}
  .sb-foot a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--text-dim);text-decoration:none;font-size:13px;cursor:pointer}
  .sb-foot a:hover{background:#1a2129;color:var(--text)}

  /* MAIN */
  .main{position:relative;height:100vh;overflow:hidden;background:var(--bg)}
  .frame{width:100%;height:100%;border:0;display:block;background:var(--bg)}
  .frame-wrap{position:absolute;inset:0}
  .loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:5}
  .loading.show{opacity:1}
  .loading .spinner{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.08);border-top-color:var(--teal-2);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

  </main>
</div>

<script>
  // Decode base64 → string (UTF-8 safe)
  function b64ToStr(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  // Override injection — hides inner sidebar, lets content use full width.
  const OVERRIDE_STYLE = `
    <style id="outer-shell-overrides">
      .sb { display: none !important; }
      .shell { grid-template-columns: 1fr !important; }
      html, body { background: #0c0f12 !important; }
      .page-label { display: none !important; }
    </style>
  `;

  // Inject the override <style> just before </head> in each page's HTML.
  function prepare(html) {
    if (/<\/head>/i.test(html)) {
      return html.replace(/<\/head>/i, OVERRIDE_STYLE + '</head>');
    }
    // Fallback: prepend
    return OVERRIDE_STYLE + html;
  }

  // Cache decoded HTML per page
  const cache = {};
  function getPageHtml(key) {
    if (!cache[key]) cache[key] = prepare(b64ToStr(PAGES[key]));
    return cache[key];
  }

  const frame   = document.getElementById('frame');
  const loading = document.getElementById('loading');
  const nav     = document.getElementById('nav');

  function loadPage(key) {
    loading.classList.add('show');
    // Use srcdoc for fully-inline rendering (no cross-origin / network needed)
    frame.srcdoc = getPageHtml(key);
  }

  frame.addEventListener('load', () => {
    loading.classList.remove('show');
  });

  nav.addEventListener('click', (e) => {
    const a = e.target.closest('a[data-page]');
    if (!a) return;
    e.preventDefault();
    nav.querySelectorAll('a').forEach(el => el.classList.remove('active'));
    a.classList.add('active');
    const page = a.getAttribute('data-page');
    loadPage(page);
    history.replaceState(null, '', '#' + page);
  });

  // Initial load — honor hash if present
  const initial = (location.hash || '').replace('#', '') || 'dashboard';
  const target  = nav.querySelector(`a[data-page="${initial}"]`) || nav.querySelector('a[data-page="dashboard"]');
  nav.querySelectorAll('a').forEach(el => el.classList.remove('active'));
  target.classList.add('active');
  loadPage(target.getAttribute('data-page'));

  // Handle navigation requests from iframe pages (e.g. clicking sample location 1)
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'resolve-nav' && PAGES[e.data.page]) {
      loadPage(e.data.page);
      history.replaceState(null, '', '#' + e.data.page);
      // Keep sidebar highlight on 'locations' when viewing the location detail
      nav.querySelectorAll('a').forEach(el => el.classList.remove('active'));
      const target = nav.querySelector('a[data-page="' + e.data.page + '"]')
                  || nav.querySelector('a[data-page="locations"]');
      if (target) target.classList.add('active');
    }
  });
</script>
</body>
</html>
